<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>彩色描边流光 · 精简预览</title>
<style>
@property --angle {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}

@property --glow-angle {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}

:root {
  color: #111;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
  font-synthesis: none;
}

* {
  box-sizing: border-box;
}

html,
body {
  min-width: 320px;
  min-height: 100%;
  margin: 0;
}

body {
  min-height: 100vh;
  overflow: hidden;
  background: transparent;
}

button {
  font: inherit;
}

.preview {
  width: max-content;
  margin: 0 auto;
  padding: 48px 32px 168px;
  display: flex;
  align-items: flex-start;
  gap: 16px;
}

.phone-frame {
  position: relative;
  width: 750px;
  height: 1624px;
  flex: 0 0 auto;
  overflow: hidden;
  border: 12px solid #1a1a1a;
  border-radius: 72px;
  background: #f4f5f7;
  box-shadow: 0 30px 80px rgba(0,0,0,.18), inset 0 0 0 2px #333;
  --phone-scale: .375;
  transform: scale(var(--phone-scale));
  transform-origin: top left;
  margin-right: calc((750px * (1 - var(--phone-scale))) * -1);
  margin-bottom: calc((1624px * (1 - var(--phone-scale))) * -1);
}

.phone-frame::before {
  content: '';
  position: absolute;
  z-index: 100;
  top: 22px;
  left: 50%;
  width: 220px;
  height: 34px;
  border-radius: 20px;
  background: #1a1a1a;
  transform: translateX(-50%);
  pointer-events: none;
}

.phone-frame::after {
  content: '';
  position: absolute;
  z-index: 100;
  bottom: 20px;
  left: 50%;
  width: 260px;
  height: 8px;
  border-radius: 4px;
  background: #1a1a1a;
  transform: translateX(-50%);
  pointer-events: none;
}

.phone-content {
  position: absolute;
  inset: 0;
}

.module {
  position: absolute;
}

.module--icon {
  width: 108px;
  height: 108px;
  top: 1372px;
  left: 321px;
  --mod-radius: 26px;
}

.module--copilot {
  width: 654px;
  height: 140px;
  top: 1352px;
  left: 48px;
  --mod-radius: 22px;
}

.module--input {
  width: 654px;
  height: 108px;
  top: 1372px;
  left: 48px;
  --mod-radius: 22px;
}

.module--card {
  width: 646px;
  height: 810px;
  top: 540px;
  left: 52px;
  --mod-radius: 20px;
}

.flow-box {
  position: relative;
  width: 100%;
  height: 100%;
}

.flow-box__bg {
  position: absolute;
  z-index: 1;
  inset: 0;
  border-radius: var(--mod-radius);
  background: #fff;
  box-shadow: 0 18px 54px rgba(31, 39, 59, .055);
}

.flow-box__fade,
.flow-box__animation {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.flow-box__stroke,
.flow-box__glow-inner,
.flow-box__glow-outer {
  position: absolute;
  z-index: 0;
  background: conic-gradient(
    from var(--angle),
    rgba(255,198,98,.5) 5%,
    rgba(255,151,79,.55) 10%,
    #ff6200 25%,
    #ff598e 40%,
    #ff6cbe 45%,
    #9966f6 55%,
    #468fff 60%,
    #5ea0ff 65%,
    #8abfff 75%,
    #e2f8ff 90%,
    #ffe9b5 100%
  );
}

.flow-box__stroke {
  inset: -3.5px;
  border-radius: calc(var(--mod-radius) + 3.5px);
  padding: 3.5px;
  -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);
  mask-composite: exclude;
}

.flow-box__glow-inner,
.flow-box__glow-outer {
  background: conic-gradient(
    from var(--glow-angle),
    rgba(255,198,98,.5) 5%,
    rgba(255,151,79,.55) 10%,
    #ff6200 25%,
    #ff598e 40%,
    #ff6cbe 45%,
    #9966f6 55%,
    #468fff 60%,
    #5ea0ff 65%,
    #8abfff 75%,
    #e2f8ff 90%,
    #ffe9b5 100%
  );
}

.flow-box__glow-inner {
  inset: -2px;
  border-radius: calc(var(--mod-radius) + 2px);
  padding: 2px;
  opacity: .55;
  filter: blur(4px);
  -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);
  mask-composite: exclude;
}

.flow-box__glow-outer {
  inset: -1px;
  border-radius: calc(var(--mod-radius) + 1px);
  opacity: 1;
  filter: blur(10px);
}

.flow-box__content {
  position: absolute;
  z-index: 3;
  inset: 0;
  display: flex;
  align-items: center;
  border-radius: var(--mod-radius);
}

.flow-box__content--copilot {
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  padding: 0 clamp(18px, 4.9%, 32px);
}

.flow-box__content--input {
  padding: 0 clamp(18px, 4.9%, 32px);
}

.flow-box__content--card {
  align-items: flex-end;
  padding: 0 clamp(24px, 6.2%, 40px) clamp(24px, 6.2%, 40px);
}

.content-title {
  color: #111;
  font-size: clamp(18px, 2vw, 26px);
  font-weight: 600;
  line-height: 1.2;
}

.content-subtitle {
  margin-top: 4px;
  color: #999;
  font-size: clamp(15px, 1.7vw, 22px);
  line-height: 1.25;
}

.input-placeholder {
  margin-left: 16px;
  color: #bbb;
  font-size: clamp(16px, 1.85vw, 24px);
}

.controls {
  position: fixed;
  z-index: 20;
  bottom: max(48px, env(safe-area-inset-bottom));
  left: 50%;
  width: min(576px, calc(100% - 26px));
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px 19px;
  border: 1px solid rgba(255,255,255,.8);
  border-radius: 13px;
  background: rgba(255,255,255,.92);
  box-shadow: 0 8px 30px rgba(24, 31, 48, .1);
  backdrop-filter: blur(18px);
}

.controls__row {
  display: grid;
  grid-template-columns: 58px 1fr;
  align-items: center;
  gap: 10px;
}

.controls__label {
  padding-right: 4px;
  color: #888;
  font-size: 10px;
  letter-spacing: .5px;
  text-align: right;
}

.controls__buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.controls button {
  min-width: 61px;
  padding: 6px 11px;
  border: 1px solid #e5e5e5;
  border-radius: 6px;
  background: #fff;
  color: #555;
  font-size: 10px;
  line-height: 1;
  cursor: pointer;
  transition: color .18s, border-color .18s, background-color .18s;
}

.controls button:hover {
  border-color: #bbb;
  color: #222;
}

.controls button.active {
  border-color: #222;
  background: #222;
  color: #fff;
}

.controls__divider {
  height: 1px;
  margin: 2px 0;
  background: #f0f0f0;
}

@keyframes rotate-stroke {
  from { --angle: 0deg; }
  to { --angle: 360deg; }
}

@keyframes rotate-glow {
  from { --glow-angle: 0deg; }
  to { --glow-angle: 360deg; }
}

@keyframes breath-light {
  0%, 100% { opacity: .5; }
  50% { opacity: 1; }
}

@keyframes breath-eternal {
  0% { opacity: .2; }
  40%, 55% { opacity: 1; }
  100% { opacity: .2; }
}

@keyframes breath-deep {
  0%, 100% { opacity: .25; }
  35%, 45% { opacity: 1; }
  95% { opacity: .25; }
}

@keyframes fade-once {
  0%, 80% { opacity: 1; }
  100% { opacity: 0; }
}

@media (max-width: 980px) {
  .preview {
    margin: 0;
    padding-inline: 24px;
  }
}

@media (max-width: 560px) {
  .preview {
    padding: 32px 18px 220px;
  }

  .phone-frame {
    --phone-scale: .3;
  }

  .controls {
    padding: 14px;
  }

  .controls__row {
    grid-template-columns: 1fr;
    gap: 8px;
  }

  .controls__label {
    padding: 0;
    text-align: left;
  }

  .controls__buttons {
    flex-wrap: nowrap;
  }

  .controls button {
    min-width: 0;
    flex: 1;
    padding-inline: 8px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .flow-box__animation,
  .flow-box__fade {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>
<body>

<main class="preview" aria-label="四种彩色描边流光组件预览">
  <div class="phone-frame" aria-label="图标流光手机预览">
    <div class="phone-content">
      <div class="module module--icon">
        <div class="flow-box">
          <div class="flow-box__fade">
            <div class="flow-box__animation">
              <div class="flow-box__glow-outer"></div>
              <div class="flow-box__glow-inner"></div>
              <div class="flow-box__stroke"></div>
            </div>
          </div>
          <div class="flow-box__bg"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="phone-frame" aria-label="Copilot 流光手机预览">
    <div class="phone-content">
      <div class="module module--copilot">
        <div class="flow-box">
          <div class="flow-box__fade">
            <div class="flow-box__animation">
              <div class="flow-box__glow-outer"></div>
              <div class="flow-box__glow-inner"></div>
              <div class="flow-box__stroke"></div>
            </div>
          </div>
          <div class="flow-box__bg"></div>
          <div class="flow-box__content flow-box__content--copilot">
            <div class="content-title">COPILOT</div>
            <div class="content-subtitle">AI is thinking</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="phone-frame" aria-label="输入框流光手机预览">
    <div class="phone-content">
      <div class="module module--input">
        <div class="flow-box">
          <div class="flow-box__fade">
            <div class="flow-box__animation">
              <div class="flow-box__glow-outer"></div>
              <div class="flow-box__glow-inner"></div>
              <div class="flow-box__stroke"></div>
            </div>
          </div>
          <div class="flow-box__bg"></div>
          <div class="flow-box__content flow-box__content--input">
            <span class="content-title">INPUT</span>
            <span class="input-placeholder">Send a message</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="phone-frame" aria-label="卡片流光手机预览">
    <div class="phone-content">
      <div class="module module--card">
        <div class="flow-box">
          <div class="flow-box__fade">
            <div class="flow-box__animation">
              <div class="flow-box__glow-outer"></div>
              <div class="flow-box__glow-inner"></div>
              <div class="flow-box__stroke"></div>
            </div>
          </div>
          <div class="flow-box__bg"></div>
          <div class="flow-box__content flow-box__content--card">
            <div>
              <div class="content-title">CARD</div>
              <div class="content-subtitle">Product Details</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<div class="controls" aria-label="动画控制">
  <div class="controls__row">
    <span class="controls__label">播放</span>
    <div class="controls__buttons">
      <button class="mode-button" type="button" data-mode="loop">循环播放</button>
      <button class="mode-button active" type="button" data-mode="once">单次播放</button>
    </div>
  </div>

  <div class="controls__divider"></div>

  <div class="controls__row">
    <span class="controls__label">动画节奏</span>
    <div class="controls__buttons">
      <button class="tempo-button" type="button" data-tempo="fast">高速版 · 1s</button>
      <button class="tempo-button active" type="button" data-tempo="mid">中速版 · 2s</button>
      <button class="tempo-button" type="button" data-tempo="slow">低速版 · 3s</button>
    </div>
  </div>
</div>

<script>
const tempos = {
  fast: { duration: '1s', breath: 'breath-light', curve: 'ease-in-out' },
  mid: { duration: '2s', breath: 'breath-eternal', curve: 'linear' },
  slow: { duration: '3s', breath: 'breath-deep', curve: 'cubic-bezier(.65, 0, .35, 1)' }
};

let currentTempo = 'mid';
let currentMode = 'once';

function applyAnimation() {
  const tempo = tempos[currentTempo];
  const iteration = currentMode === 'loop' ? 'infinite' : '1';
  const fillMode = currentMode === 'loop' ? '' : 'forwards';

  document.querySelectorAll('.flow-box').forEach((box) => {
    const stroke = box.querySelector('.flow-box__stroke');
    const glowInner = box.querySelector('.flow-box__glow-inner');
    const glowOuter = box.querySelector('.flow-box__glow-outer');
    const animation = box.querySelector('.flow-box__animation');
    const fade = box.querySelector('.flow-box__fade');

    stroke.style.animation = `rotate-stroke ${tempo.duration} linear ${iteration} ${fillMode}`.trim();
    glowInner.style.animation = `rotate-glow ${tempo.duration} linear ${iteration} ${fillMode}`.trim();
    glowOuter.style.animation = `rotate-glow ${tempo.duration} linear ${iteration} ${fillMode}`.trim();
    animation.style.animation = `${tempo.breath} ${tempo.duration} ${tempo.curve} ${iteration} ${fillMode}`.trim();

    if (currentMode === 'once') {
      fade.style.opacity = '1';
      fade.style.animation = `fade-once ${tempo.duration} ease-in forwards`;
    } else {
      fade.style.animation = 'none';
      fade.style.opacity = '1';
    }
  });
}

function replay() {
  document.querySelectorAll(
    '.flow-box__stroke, .flow-box__glow-inner, .flow-box__glow-outer, .flow-box__animation, .flow-box__fade'
  ).forEach((element) => {
    element.style.animation = 'none';
    void element.offsetHeight;
  });
  applyAnimation();
}

document.querySelectorAll('.mode-button').forEach((button) => {
  button.addEventListener('click', () => {
    currentMode = button.dataset.mode;
    document.querySelectorAll('.mode-button').forEach((item) => item.classList.toggle('active', item === button));
    replay();
  });
});

document.querySelectorAll('.tempo-button').forEach((button) => {
  button.addEventListener('click', () => {
    currentTempo = button.dataset.tempo;
    document.querySelectorAll('.tempo-button').forEach((item) => item.classList.toggle('active', item === button));
    replay();
  });
});

applyAnimation();
</script>
</body>
</html>
